<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b1d12">
<meta name="description" content="WashKit — laundry, sorted: your clothesline, wash-day planner, care-symbol decoder, stain SOS, laundry cost maths and a drying forecast for Bengaluru.">
<title>WashKit — Laundry, Sorted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf6ee; --paper2:#f3ecdd; --card:#fffdf7; --ink:#2b1d12; --ink2:#5c4632;
  --muted:#8a7360; --line:#e5d9c3; --bronze:#b7791f; --bronze2:#d9a441; --gold:#e8b84b;
  --terra:#c05b2e; --terra2:#a34a24; --sage:#7a7a52; --green:#4a7a3f; --red:#b3402e;
  --dark:#241812; --dark2:#3a2a1e; --shadow:0 10px 30px rgba(43,29,18,.10);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--terra)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze)}
.sec{padding:44px 0 8px}
.sec h2{font-size:clamp(26px,4vw,36px);font-weight:800;line-height:1.12;margin:6px 0 6px}
.sec .sub{color:var(--ink2);max-width:640px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip.gold{background:#f7e8c4;border-color:#e8cf96;color:#7a5510}
.chip.green{background:#e6efe0;border-color:#c4d8b8;color:#33511f}
.chip.red{background:#fbe4de;border-color:#f0c0b4;color:#8c2f1d}
.chip.terra{background:#fbeadd;border-color:#eec4a8;color:#7c3416}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14.5px;background:var(--ink);color:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(43,29,18,.25)}
.btn.terra{background:var(--terra)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.icon{width:18px;height:18px;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:var(--dark);color:#f7ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s,visibility .6s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .lineart{width:min(440px,86vw);height:110px;position:relative;margin-bottom:6px}
#intro .lineart svg{width:100%;height:100%}
#intro .sway{transform-origin:50% 0;animation:sway 2.8s ease-in-out infinite}
#intro .sway.d2{animation-delay:-.9s}
#intro .sway.d3{animation-delay:-1.8s}
@keyframes sway{0%,100%{transform:rotate(1.6deg)}50%{transform:rotate(-1.6deg)}}
#intro h1{font-size:clamp(38px,8vw,64px);font-weight:800;letter-spacing:.01em}
#intro h1 span{color:var(--gold)}
#intro p{opacity:.85;max-width:440px;margin:10px auto 0;font-size:16px}
#intro .bar{width:min(300px,70vw);height:4px;background:rgba(255,255,255,.18);border-radius:99px;margin:26px auto 0;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .3s}
#intro .skip{margin-top:18px;background:none;border:1px solid rgba(255,255,255,.35);color:#f7ead2;border-radius:999px;padding:8px 18px;font-weight:600;font-size:13px}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:90;background:rgba(250,246,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:22px;color:var(--ink);text-decoration:none}
.logo .mark{width:38px;height:38px;border-radius:12px;background:var(--dark);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.logo .mark svg{width:22px;height:22px}
header.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
header.top nav a{color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:99px}
header.top nav a:hover{background:var(--paper2);color:var(--ink)}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;background:var(--dark)}
.hero img{width:100%;height:min(58vh,460px);object-fit:cover;opacity:.92;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.08) translateX(-1.5%)}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,24,18,.05) 40%,rgba(36,24,18,.78) 100%)}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:28px 0 30px;color:#fdf6e7}
.hero .copy .wrap{max-width:1080px}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;line-height:1.05;max-width:640px}
.hero h1 span{color:var(--gold)}
.hero p{opacity:.92;max-width:560px;margin-top:10px;font-size:17px}
.todaystrip{margin-top:-26px;position:relative;z-index:5}
.todaystrip .card{display:grid;grid-template-columns:repeat(4,1fr);gap:0;overflow:hidden}
.todaystrip .cell{padding:18px 20px;border-right:1px solid var(--line)}
.todaystrip .cell:last-child{border-right:0}
.todaystrip .cell b{font-size:24px;font-family:Fraunces,Georgia,serif;display:block;line-height:1.1}
