<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b1d12">
<meta name="description" content="WashKit — laundry, sorted: your clothesline, wash-day planner, care-symbol decoder, stain SOS, laundry cost maths and a drying forecast for Bengaluru.">
<title>WashKit — Laundry, Sorted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf6ee; --paper2:#f3ecdd; --card:#fffdf7; --ink:#2b1d12; --ink2:#5c4632;
  --muted:#8a7360; --line:#e5d9c3; --bronze:#b7791f; --bronze2:#d9a441; --gold:#e8b84b;
  --terra:#c05b2e; --terra2:#a34a24; --sage:#7a7a52; --green:#4a7a3f; --red:#b3402e;
  --dark:#241812; --dark2:#3a2a1e; --shadow:0 10px 30px rgba(43,29,18,.10);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--terra)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--bronze)}
.sec{padding:44px 0 8px}
.sec h2{font-size:clamp(26px,4vw,36px);font-weight:800;line-height:1.12;margin:6px 0 6px}
.sec .sub{color:var(--ink2);max-width:640px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip.gold{background:#f7e8c4;border-color:#e8cf96;color:#7a5510}
.chip.green{background:#e6efe0;border-color:#c4d8b8;color:#33511f}
.chip.red{background:#fbe4de;border-color:#f0c0b4;color:#8c2f1d}
.chip.terra{background:#fbeadd;border-color:#eec4a8;color:#7c3416}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:700;font-size:14.5px;background:var(--ink);color:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(43,29,18,.25)}
.btn.terra{background:var(--terra)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.icon{width:18px;height:18px;flex:none}
.muted{color:var(--muted)}
.small{font-size:13px}
/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:var(--dark);color:#f7ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s,visibility .6s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .lineart{width:min(440px,86vw);height:110px;position:relative;margin-bottom:6px}
#intro .lineart svg{width:100%;height:100%}
#intro .sway{transform-origin:50% 0;animation:sway 2.8s ease-in-out infinite}
#intro .sway.d2{animation-delay:-.9s}
#intro .sway.d3{animation-delay:-1.8s}
@keyframes sway{0%,100%{transform:rotate(1.6deg)}50%{transform:rotate(-1.6deg)}}
#intro h1{font-size:clamp(38px,8vw,64px);font-weight:800;letter-spacing:.01em}
#intro h1 span{color:var(--gold)}
#intro p{opacity:.85;max-width:440px;margin:10px auto 0;font-size:16px}
#intro .bar{width:min(300px,70vw);height:4px;background:rgba(255,255,255,.18);border-radius:99px;margin:26px auto 0;overflow:hidden}
#intro .bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .3s}
#intro .skip{margin-top:18px;background:none;border:1px solid rgba(255,255,255,.35);color:#f7ead2;border-radius:999px;padding:8px 18px;font-weight:600;font-size:13px}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:90;background:rgba(250,246,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:22px;color:var(--ink);text-decoration:none}
.logo .mark{width:38px;height:38px;border-radius:12px;background:var(--dark);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.logo .mark svg{width:22px;height:22px}
header.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
header.top nav a{color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 10px;border-radius:99px}
header.top nav a:hover{background:var(--paper2);color:var(--ink)}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;background:var(--dark)}
.hero img{width:100%;height:min(58vh,460px);object-fit:cover;opacity:.92;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.08) translateX(-1.5%)}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(36,24,18,.05) 40%,rgba(36,24,18,.78) 100%)}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:28px 0 30px;color:#fdf6e7}
.hero .copy .wrap{max-width:1080px}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;line-height:1.05;max-width:640px}
.hero h1 span{color:var(--gold)}
.hero p{opacity:.92;max-width:560px;margin-top:10px;font-size:17px}
.todaystrip{margin-top:-26px;position:relative;z-index:5}
.todaystrip .card{display:grid;grid-template-columns:repeat(4,1fr);gap:0;overflow:hidden}
.todaystrip .cell{padding:18px 20px;border-right:1px solid var(--line)}
.todaystrip .cell:last-child{border-right:0}
.todaystrip .cell b{font-size:24px;font-family:Fraunces,Georgia,serif;display:block;line-height:1.1}
.todaystrip .cell span{font-size:12.5px;color:var(--muted);font-weight:600}
/* ---------- clothesline ---------- */
.line{position:relative;background:linear-gradient(180deg,#fdf8ec,#f7ecd4);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:34px 22px 22px;overflow:hidden}
.line .rope{position:absolute;left:0;right:0;top:26px;height:2px;background:repeating-linear-gradient(90deg,#b99b6b 0 10px,#8a6f45 10px 12px)}
.line .pegrow{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:thin}
.garment{flex:0 0 168px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;position:relative;transform-origin:50% 0;animation:sway 4.5s ease-in-out infinite}
.garment:nth-child(2n){animation-delay:-1.2s}
.garment:nth-child(3n){animation-delay:-2.4s}
.garment::before{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:12px;height:16px;border-radius:3px;background:var(--bronze2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.garment .gicon{width:44px;height:44px;border-radius:12px;background:var(--paper2);display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:var(--terra)}
.garment .gicon svg{width:26px;height:26px}
.garment h3{font-size:16px;line-height:1.25}
.garment .meta{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:34px}
.garment .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.garment .washed{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--ink)}
.garment .washed:hover{border-color:var(--bronze);color:var(--terra)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.green{background:var(--green)} .dot.amber{background:var(--bronze2)} .dot.red{background:var(--red)}
/* ---------- planner ---------- */
.plan{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.weekdays{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.daypill{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;width:56px;text-align:center;font-weight:700;font-size:13.5px;color:var(--ink2)}
.daypill.on{background:var(--dark);color:var(--gold);border-color:var(--dark)}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{width:110px;height:110px;flex:none}
.ring .track{stroke:var(--line);fill:none;stroke-width:10}
.ring .val{stroke:var(--terra);fill:none;stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s}
.ring text{font-family:Fraunces,Georgia,serif;font-weight:800;fill:var(--ink)}
.loadrow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line);font-size:14.5px}
.loadrow:first-of-type{border-top:0}
.loadrow .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
.loadrow.done .tick{background:var(--green);border-color:var(--green)}
.loadrow.done .lbl{color:var(--muted);text-decoration:line-through}
/* ---------- decoder ---------- */
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sym{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px 14px;text-align:center;box-shadow:var(--shadow)}
.sym svg{width:64px;height:64px;margin:0 auto 8px}
.sym h3{font-size:14.5px;line-height:1.3}
.sym p{font-size:12.5px;color:var(--muted);margin-top:4px;min-height:32px}
.sym .tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bronze)}
.catbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.catbar button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.catbar button.on{background:var(--dark);color:var(--gold);border-color:var(--dark)}
/* ---------- stain SOS ---------- */
.stainpick{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.stainbtn{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;color:var(--ink2);box-shadow:var(--shadow)}
.stainbtn.on{background:var(--terra);border-color:var(--terra);color:#fff}
.steps{counter-reset:st}
.step{display:flex;gap:14px;padding:14px 4px;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step::before{counter-increment:st;content:counter(st);flex:none;width:30px;height:30px;border-radius:50%;background:var(--dark);color:var(--gold);font-family:Fraunces,Georgia,serif;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.step b{display:block;font-size:15px}
.step p{color:var(--ink2);font-size:14.5px}

/* ---------- cost ---------- */
.costgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sliderow{padding:12px 0;border-top:1px solid var(--line)}
.sliderow:first-of-type{border-top:0}
.sliderow label{display:flex;justify-content:space-between;font-weight:600;font-size:14.5px;margin-bottom:6px}
.sliderow input[type=range]{width:100%;accent-color:var(--terra)}
.bigmoney{font-family:Fraunces,Georgia,serif;font-size:40px;font-weight:800;line-height:1}
.bigmoney small{font-size:16px;color:var(--muted);font-family:Inter,sans-serif;font-weight:600}
.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.compare .col{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.compare .col b{font-family:Fraunces,Georgia,serif;font-size:22px;display:block}
.compare .col span{font-size:12.5px;color:var(--muted)}
.compare .col.win{border-color:var(--green);background:#f2f6ec}
/* ---------- forecast ---------- */
.forecast{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.verdict{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:800;line-height:1.15}
.fstat{display:flex;justify-content:space-between;padding:10px 2px;border-top:1px solid var(--line);font-size:14.5px}
.fstat:first-of-type{border-top:0}
.fstat b{font-weight:700}
/* ---------- guides / misc ---------- */
.guides{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.guide{padding:20px}
.guide h3{font-size:18px;margin-bottom:6px}
.guide p{color:var(--ink2);font-size:14.5px}
.guide .k{margin-top:10px;font-size:13px;color:var(--terra);font-weight:700}
